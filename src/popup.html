<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
    h1 { font-size: 18px; margin-bottom: 12px; color: #7c3aed; }
    .mode-btn { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #333; border-radius: 8px; background: #16213e; color: #e0e0e0; cursor: pointer; font-size: 14px; text-align: left; transition: all 0.2s; }
    .mode-btn:hover { background: #7c3aed; border-color: #7c3aed; }
    .mode-btn.active { background: #7c3aed; border-color: #7c3aed; }
    .status { margin-top: 12px; font-size: 12px; color: #888; text-align: center; }
    .upgrade { margin-top: 16px; padding: 10px; background: #2d1b69; border-radius: 8px; text-align: center; }
    .upgrade a { color: #a78bfa; text-decoration: none; font-weight: bold; }
    .badge { display: inline-block; padding: 2px 8px; background: #7c3aed; border-radius: 12px; font-size: 10px; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>🤖 AI Text Pro</h1>
  <p style="font-size:12px;color:#888;margin-bottom:12px">Select text on any page, then choose a mode:</p>
  
  <button class="mode-btn active" data-mode="improve">✨ Improve Writing</button>
  <button class="mode-btn" data-mode="grammar">📝 Fix Grammar</button>
  <button class="mode-btn" data-mode="summarize">📋 Summarize</button>
  <button class="mode-btn" data-mode="translate">🌐 Translate to EN</button>
  <button class="mode-btn" data-mode="shorter">✂️ Make Shorter</button>
  <button class="mode-btn" data-mode="longer">📏 Make Longer</button>
  
  <div class="status" id="status">Ready — select text and click a mode</div>
  
  <div class="upgrade">
    <strong>⚡ Pro Version</strong><br>
    <span style="font-size:12px">Unlimited usage + GPT-4o</span><br>
    <a href="https://paypal.me/ulnit/5" target="_blank">$5 one-time →</a>
    <span class="badge">50 uses free</span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
